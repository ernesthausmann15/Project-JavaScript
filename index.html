<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="background-glow" aria-hidden="true"></div>

    <!-- Header section -->
    <header>
      <h1 class="website__title">Movie Grab</h1>
      <nav class="navbar">
        <ul class="nav-links">
          <li class="nav-item"><a href="#">Home</a></li>
          <li class="nav-item"><a href="#">Find Your Movie</a></li>
          <li class="nav-item"><a href="#">Contact</a></li>
        </ul>
      </nav>
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="Switch to dark mode"
        aria-pressed="false"
      >
        <span aria-hidden="true">☾</span>
        <span class="theme-toggle__text">Dark mode</span>
      </button>
    </header>

    <!-- Hero section -->
    <section class="hero">
      <h2 class="hero__title">Find Your Movie</h2>
      <p class="hero__description">
        Discover the best movies based on your preferences.
      </p>
      <a href="#" class="hero__cta">Get Started</a>
    </section>

    <!-- Movie search section -->
    <section class="movie__search">
      <h2 class="movie__search-title">Search for a Movie</h2>
      <form id="search__form" class="movie__search-form">
        <input
          id="search__input"
          type="text"
          placeholder="Enter movie title"
          class="movie__search-input"
        />
        <button type="submit" class="movie__search-button">Search</button>
      </form>
    </section>

    <!-- Movie results section -->
    <section class="movie__results">
      <h2 class="movie__results-title">Movie Results</h2>

      <div class="filter__wrapper">
        <select id="filter" onchange="filterMovies(event)">
          <option value="" disabled selected>Sort by...</option>
          <option value="NEWEST">Release Year, New to Old</option>
          <option value="OLDEST">Release Year, Old to New</option>
        </select>
      </div>

      <div class="movie__results-container">
        <div class="row movie__result">
          <ul class="movie__result-list" id="movie__list"></ul>
        </div>
      </div>
      <div id="movie__modal" class="modal">
        <div class="modal__content">
          <button class="modal__close">&times;</button>
          <img id="modal__poster" src="" alt="Movie Poster" />
          <h2 id="modal__title"></h2>
          <p id="modal__year"></p>
          <p id="modal__released"></p>
          <p id="modal__runtime"></p>
          <p id="modal__genre"></p>
          <p id="modal__director"></p>
          <p id="modal__writer"></p>
          <p id="modal__actors"></p>
          <p id="modal__plot"></p>
          <p id="modal__language"></p>
          <p id="modal__country"></p>
          <p id="modal__awards"></p>
          <p id="modal__ratings"></p>
          <p id="modal__metascore"></p>
          <p id="modal__imdbRating"></p>
          <p id="modal__imdbVotes"></p>
          <p id="modal__imdbID"></p>
          <p id="modal__type"></p>
          <p id="modal__dvd"></p>
          <p id="modal__boxOffice"></p>
          <p id="modal__production"></p>
          <p id="modal__website"></p>
        </div>
      </div>
    </section>

    <!-- Footer section -->
    <footer class="footer">
      <p class="footer__text">&copy; 2024 Movie Grab. All rights reserved.</p>
    </footer>
  </body>
</html>
